<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>INAE — inae</title>
<style>/* ============================================================
   INAE (이내) — Design Tokens

   Single source of truth for this line. GOYO's /css/tokens.css is
   a different file for a different line; never link both.

   ⚠️  EVERY VALUE BELOW IS PROVISIONAL.
   The only design input that exists today is the Framer landing
   teaser — 색 · 달 · 구름 · 별 (color, moon, cloud, star). There is
   no INAE page in Figma yet. These values exist so the pipeline
   renders something; replace them wholesale once the motif lands.
   The *variable names* are the stable part — the contract that
   inae/css/base.css and inae/tools/build.mjs are written against.
   ============================================================ */
:root{
  /* ---- palette --------------------------------------------------------- */
  --bg:#171a24;          /* page base                                       */
  --surface:#1f2331;     /* raised panels                                   */
  --line:#333850;        /* visible borders                                 */
  --hair:#262b3a;        /* hairline separators                             */
  --ink:#e8e6ef;         /* primary text                                    */
  --muted:#8d92a8;       /* secondary text / labels                         */
  --faint:#5e6377;       /* tertiary text                                   */
  --accent:#9aa6d4;      /* PRIMARY accent                                  */
  --accent-deep:#3b4260;
  --accent-line:#39405c;
  --accent2:#e3d2a8;     /* SECONDARY accent                                */
  --accent2-line:rgba(227,210,168,.40);
  --accent2-fill:rgba(227,210,168,.05);

  /* motif slots — 색 · 달 · 구름 · 별. Named after the teaser so the
     mapping from concept to code stays legible once art exists. */
  --moon:#f2ead6;
  --cloud:#4a5068;
  --star:#cfd6f0;

  /* ---- type ------------------------------------------------------------ */
  /* No webfont is embedded yet (inae/assets/fonts/ is empty) — typefaces are
     part of the undecided motif. System stacks keep the preview honest:
     what you see is explicitly NOT the final type. */
  --serif:Georgia,'Times New Roman',serif;
  --sans:system-ui,-apple-system,'Segoe UI',sans-serif;
  --t-num:60px;          /* focal numeral                                   */
  --t-h1:38px;           /* page title                                      */
  --t-body:15px;
  --t-label:11px;        /* uppercase micro-labels                          */
  --t-meta:12px;
  --ls-label:.18em;      /* label letter-spacing                            */

  /* ---- spacing & frame ------------------------------------------------- */
  /* Page size is a FORMAT constraint (GoodNotes/Notability portrait), not a
     design choice — it is the one number INAE and GOYO agree on by accident,
     not by coupling. It still lives here so this line can change it alone. */
  --pw:1080px; --ph:1440px;
  --pad:44px;            /* body padding                                    */
  --gap:22px;
}

/* =========================================================================
   INAE (이내) — BASE LAYOUT

   Format layer only: the workspace chrome, the page frame, and link
   neutralisation. Everything here is dictated by "this has to print to a
   1080×1440 hyperlinked PDF", not by how INAE looks.

   ⚠️  Deliberately does NOT carry GOYO's component set (.tabs, .rail, .seal,
   .sec, .box, .row …). Those are GOYO's design language. INAE's components
   get written here once its page set is decided — copying GOYO's would make
   INAE a reskin, which is exactly what "별개 라인" rules out.
   ========================================================================= */

*{box-sizing:border-box;}

/* ---- workspace (outside the page; ignored on export) -------------------- */
body{margin:0;background:#0b0d13;font-family:var(--sans);color:var(--ink);
  display:flex;flex-direction:column;align-items:center;padding:60px 20px 120px;}
.flabel{width:var(--pw);margin:34px auto 8px;color:var(--faint);font-size:13px;
  letter-spacing:.16em;text-transform:uppercase;font-weight:500;}
.flabel span{color:var(--accent);}

/* ---- page frame --------------------------------------------------------- */
.page{width:var(--pw);height:var(--ph);background:var(--bg);position:relative;
  overflow:hidden;flex:none;}
.content{position:absolute;inset:0;padding:var(--pad);
  display:flex;flex-direction:column;}

/* nav anchors inherit page styling (no default link colour/underline) */
.page a{color:inherit;text-decoration:none;}


/* ---------------------------------------------------------------------
   PROVISIONAL cover styling. Lives inline on purpose: it is scaffolding,
   not design system. When the real motif lands, this block moves into
   css/base.css as proper components (or is deleted outright).
   --------------------------------------------------------------------- */
.cover{position:absolute;inset:0;display:flex;flex-direction:column;
  justify-content:space-between;padding:var(--pad);}
.cover-top{display:flex;justify-content:space-between;align-items:baseline;}
.cover-eye{font-size:var(--t-label);letter-spacing:var(--ls-label);
  text-transform:uppercase;color:var(--accent);}
.cover-note{font-size:var(--t-meta);letter-spacing:.06em;color:var(--muted);}
.cover-art{position:absolute;inset:0;display:grid;place-items:center;}
.cover-foot{position:relative;}
.cover-name{font-family:var(--serif);font-weight:300;font-size:92px;
  letter-spacing:.02em;line-height:1;margin:0;color:var(--ink);}
.cover-name em{font-style:italic;color:var(--accent);}
.cover-sub{margin-top:14px;font-size:var(--t-body);color:var(--muted);
  letter-spacing:.04em;}
.cover-rule{margin-top:26px;padding-top:14px;border-top:1px solid var(--hair);
  display:flex;justify-content:space-between;font-size:var(--t-label);
  letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--faint);}
.todo{position:absolute;left:var(--pad);bottom:calc(var(--pad) + 260px);
  font-size:var(--t-meta);letter-spacing:.06em;color:var(--faint);
  border-left:2px solid var(--accent-line);padding-left:12px;line-height:1.9;}


/* print/export reset — only the pages render */
html,body{margin:0;padding:0;background:var(--bg);}
body{display:block;}
.page{margin:0 auto;break-after:page;page-break-after:always;}
.page:last-of-type{break-after:auto;}
@page{size:1080px 1440px;margin:0;}
@media print{html,body{background:#fff;}.page{box-shadow:none;}}
</style></head>
<body>
<div class="page" id="i-cover">
  <div class="cover">

    <!-- 색 · 달 · 구름 · 별 — the entire design brief that exists today,
         drawn as flat primitives. Not art. A stand-in that proves the page
         frame, tokens and print pipeline all work. -->
    <div class="cover-art" aria-hidden="true">
      <svg width="1080" height="1440" viewBox="0 0 1080 1440" fill="none">
        <defs>
          <radialGradient id="i-glow" cx="50%" cy="50%" r="50%">
            <stop offset="55%" stop-color="var(--moon)" stop-opacity=".16"/>
            <stop offset="100%" stop-color="var(--moon)" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <circle cx="540" cy="560" r="330" fill="url(#i-glow)"/>
        <circle cx="540" cy="560" r="168" fill="var(--moon)" opacity=".92"/>
        <ellipse cx="392" cy="690" rx="250" ry="52" fill="var(--cloud)" opacity=".55"/>
        <ellipse cx="660" cy="742" rx="310" ry="46" fill="var(--cloud)" opacity=".40"/>
        <g fill="var(--star)">
          <circle cx="226" cy="268" r="3.5" opacity=".9"/>
          <circle cx="834" cy="212" r="2.5" opacity=".7"/>
          <circle cx="905" cy="430" r="3"   opacity=".8"/>
          <circle cx="168" cy="520" r="2.5" opacity=".6"/>
          <circle cx="742" cy="330" r="2"   opacity=".55"/>
          <circle cx="300" cy="170" r="2"   opacity=".5"/>
        </g>
      </svg>
    </div>

    <div class="cover-top">
      <div class="cover-eye">Digital Planner</div>
      <div class="cover-note">for GoodNotes · Notability</div>
    </div>

    <div class="todo">
      SCAFFOLD ONLY<br>
      page set · motif · palette · type — all undecided<br>
      see inae/README.md
    </div>

    <div class="cover-foot">
      <h1 class="cover-name">IN<em>AE</em></h1>
      <div class="cover-sub">이내 — within reach</div>
      <div class="cover-rule">
        <span>JUDE · Quiet by Design</span>
        <span>Provisional</span>
      </div>
    </div>

  </div>
</div>
</body></html>
